<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Restaurant - Zomato Clone</title>
  <link rel="stylesheet" href="css/add-restaurant.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <img src="img/logo.png" alt="Zomato Logo" />
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="investor.html">Investor Relations</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Signup</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="add-restaurant-form">
    <h1>Add Your Restaurant</h1>
    <p>Fill in the details below to register your restaurant on Zomato.</p>

    <form id="restaurantForm">
      <input type="text" id="name" placeholder="Restaurant Name" required />
      <input type="text" id="owner" placeholder="Owner Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="tel" id="phone" placeholder="Phone Number" required />
      <input type="text" id="address" placeholder="Restaurant Address" required />
      <input type="text" id="cuisine" placeholder="Cuisine Types (e.g. Indian, Italian)" required />
      <textarea id="description" placeholder="Short Description" rows="4" required></textarea>
      <button type="submit">Submit Restaurant</button>
    </form>

    <div id="successMessage" class="hidden">✅ Your restaurant was submitted successfully!</div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2025 Zomato Clone | All rights are reserved
  </footer>

  <script src="js/add-restaurant.js"></script>
</body>
</html>
